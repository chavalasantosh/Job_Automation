<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InDeed Automation Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg: #ffffff;
        --surface: #f3f2f1;
        --surface2: #ffffff;
        --border: #d1d1d1;
        --text: #2d2d2d;
        --text2: #6f6f6f;
        --accent: #2557a7; /* Indeed Blue */
        --accent2: #164081;
        --green: #008000;
        --red: #d93025;
      }
      body {
        font-family: "Inter", -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 32px;
        min-height: 100vh;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 40px;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 16px;
      }
      .header h1 {
        font-size: 32px;
        font-weight: 800;
        color: var(--accent);
      }
      .status {
        display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text2);
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
      
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
      .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
      .stat-card .label { font-size: 12px; color: var(--text2); text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
      .stat-card .value { font-size: 36px; font-weight: 700; color: var(--accent); }

      .section { border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 24px; }
      .apply-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border); }
      .apply-item:last-child { border-bottom: none; }
      .apply-item .title { font-weight: 700; color: var(--accent); }
      
      #log-box { background: #f3f2f1; color: #2d2d2d; font-family: "Consolas", monospace; font-size: 13px; padding: 16px; border-radius: 4px; height: 300px; overflow-y: auto; white-space: pre-wrap; border: 1px solid var(--border); }
      .btn { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 4px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>InDeed Enterprise</h1>
      <div style="display: flex; gap: 16px; align-items: center">
        <div class="status">
          <div class="dot"></div>
          <span>Indeed Engine Active</span>
        </div>
        <button class="btn" onclick="triggerRun()">▶ Start Manual Run</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Total Indeed Applications</div>
        <div class="value" id="totalApplied">0</div>
        <div class="sub">Indeed Apply Workflow</div>
      </div>
      <div class="stat-card">
        <div class="label">Engine Status</div>
        <div class="value">Ready</div>
        <div class="sub">Pulse Interval: 4h</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px">
      <div class="section">
        <h2>Recent Indeed Applications</h2>
        <div id="applyList"></div>
      </div>
      <div class="section">
        <h2>Real-time Stream</h2>
        <div id="log-box"></div>
      </div>
    </div>

    <script>
      async function refreshStats() {
        try {
          const res = await fetch('/api/stats');
          const data = await res.json();
          document.getElementById('totalApplied').innerText = data.total_applied;
          document.getElementById('applyList').innerHTML = data.recent_applications.map(job => `
            <div class="apply-item">
              <div>
                <div class="title">${job.title}</div>
                <div class="meta">🏢 ${job.company} | 🕒 ${job.timestamp.split('T')[0]}</div>
              </div>
              <div style="color: var(--green); font-weight: 700">Applied</div>
            </div>
          `).join('');
        } catch(e) {}
      }
      async function startLogs() {
        const box = document.getElementById('log-box');
        const res = await fetch('/api/logs');
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          box.innerText += decoder.decode(value);
          box.scrollTop = box.scrollHeight;
        }
      }
      async function triggerRun() {
        await fetch('/api/run', {method: 'POST'});
        alert("Indeed run triggered!");
      }
      refreshStats(); startLogs(); setInterval(refreshStats, 30000);
    </script>
  </body>
</html>
