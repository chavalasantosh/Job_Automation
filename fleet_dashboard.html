<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NowCurry Fleet Command</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin:0; padding:0; box-sizing: border-box; }
      :root {
        --bg: #05070a;
        --card: #0f1218;
        --border: #1f232d;
        --accent: #3b82f6;
        --naukri: #004599;
        --linkedin: #0a66c2;
        --foundit: #9b30ff;
        --glassdoor: #0caa41;
        --indeed: #2557a7;
        --text: #ffffff;
        --text-dim: #9499a6;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        padding: 40px;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .master-header {
        text-align: center;
        margin-bottom: 60px;
      }
      .master-header h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: 48px;
        letter-spacing: 4px;
        background: linear-gradient(135deg, #fff 0%, #3b82f6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
      }
      .master-header p {
        color: var(--text-dim);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .fleet-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .portal-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px;
        position: relative;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: inherit;
      }
      .portal-card:hover {
        transform: translateY(-10px);
        border-color: var(--accent);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }
      .portal-card .icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 24px;
      }
      .portal-card h2 { font-size: 20px; margin-bottom: 8px; }
      .portal-card .status-badge {
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 12px;
        text-transform: uppercase;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status-online { background: rgba(16, 185, 129, 0.1); color: #10b981; }
      .status-offline { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
      .dot { width: 8px; height: 8px; border-radius: 50%; }

      .naukri-card .icon { background: var(--naukri); }
      .linkedin-card .icon { background: var(--linkedin); }
      .foundit-card .icon { background: var(--foundit); }
      .glassdoor-card .icon { background: var(--glassdoor); }
      .indeed-card .icon { background: var(--indeed); }

      .launch-all {
        position: fixed;
        bottom: 40px;
        right: 40px;
        background: var(--accent);
        color: white;
        border: none;
        padding: 16px 32px;
        border-radius: 30px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        font-family: 'Orbitron', sans-serif;
        transition: transform 0.2s;
      }
      .launch-all:active { transform: scale(0.95); }

      .hud-line {
        position: absolute;
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        top: 50%;
        left: 0;
        opacity: 0.1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="hud-line"></div>
    <div class="master-header">
      <h1>FLEET COMMAND</h1>
      <p>Autonomous Job Search Network Management</p>
    </div>

    <div class="fleet-grid" id="fleetGrid">
      <a href="http://localhost:8000" target="_blank" class="portal-card naukri-card" id="card-Naukri">
        <div class="icon">N</div>
        <h2>Naukri</h2>
        <div class="status-badge" id="status-Naukri">Checking...</div>
      </a>
      <a href="http://localhost:8001" target="_blank" class="portal-card linkedin-card" id="card-LinkedIn">
        <div class="icon">In</div>
        <h2>LinkedIn</h2>
        <div class="status-badge" id="status-LinkedIn">Checking...</div>
      </a>
      <a href="http://localhost:8002" target="_blank" class="portal-card foundit-card" id="card-Foundit">
        <div class="icon">F</div>
        <h2>Foundit</h2>
        <div class="status-badge" id="status-Foundit">Checking...</div>
      </a>
      <a href="http://localhost:8003" target="_blank" class="portal-card glassdoor-card" id="card-Glassdoor">
        <div class="icon">G</div>
        <h2>Glassdoor</h2>
        <div class="status-badge" id="status-Glassdoor">Checking...</div>
      </a>
      <a href="#" class="portal-card ai-center-card" id="card-AI" style="border: 1px solid var(--foundit); background: rgba(155, 48, 255, 0.05);">
        <div class="icon" style="background: var(--foundit); box-shadow: 0 0 20px rgba(155, 48, 255, 0.4)">AI</div>
        <h2>Gemma 4 Brain</h2>
        <div class="status-badge" id="status-AI">Ollama Active</div>
      </a>
    </div>

    <div class="stats-footer" style="margin-top: 40px; text-align: center; color: var(--text-dim); font-size: 12px; font-family: 'Orbitron', sans-serif;">
      10x SIMPLE UPGRADE ACTIVE | EXPLICIT WAIT TUNING: ON | AI REASONING: ENABLED
    </div>

    <button class="launch-all" onclick="launchFleet()">INITIALIZE 10x FLEET</button>

    <script>
      async function updateStatus() {
        try {
          const res = await fetch('/api/status');
          const status = await res.json();
          for (const [name, info] of Object.entries(status)) {
            const badge = document.getElementById(`status-${name}`);
            if (info.online) {
              badge.className = 'status-badge status-online';
              badge.innerHTML = '<div class="dot" style="background: #10b981"></div> ACTIVE';
            } else {
              badge.className = 'status-badge status-offline';
              badge.innerHTML = '<div class="dot" style="background: #ef4444"></div> OFFLINE';
            }
          }
        } catch(e) {}
      }

      async function launchFleet() {
        if(!confirm("Warning: This will launch 5 detached web server processes. Continue?")) return;
        await fetch('/api/launch-all', {method: 'POST'});
        setTimeout(updateStatus, 3000);
      }

      updateStatus();
      setInterval(updateStatus, 5000);
    </script>
  </body>
</html>
