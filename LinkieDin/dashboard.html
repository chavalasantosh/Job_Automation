<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkieDin Automation Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #0b0e14;
        --surface: #151921;
        --surface2: #1e232d;
        --border: #2a2f3a;
        --text: #e1e4ea;
        --text2: #9499a6;
        --accent: #0a66c2; /* LinkedIn Blue */
        --accent2: #0077b5;
        --green: #057642;
        --green-bg: rgba(5, 118, 66, 0.15);
        --red: #d11124;
        --red-bg: rgba(209, 17, 36, 0.15);
        --yellow: #c37d16;
        --yellow-bg: rgba(195, 125, 22, 0.15);
        --blue: #0a66c2;
        --blue-bg: rgba(10, 102, 194, 0.15);
      }
      body {
        font-family: "Inter", -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 32px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 40px;
      }
      .header h1 {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #0a66c2 0%, #00a0dc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .header .status {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: var(--text2);
        background: var(--surface);
        padding: 8px 16px;
        border-radius: 20px;
        border: 1px solid var(--border);
      }
      .header .status .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 10px var(--green);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin-bottom: 32px;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        transition: transform 0.2s, border-color 0.2s;
      }
      .stat-card:hover {
        transform: translateY(-4px);
        border-color: var(--accent);
      }
      .stat-card .label {
        font-size: 13px;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 12px;
      }
      .stat-card .value {
        font-size: 40px;
        font-weight: 700;
      }
      .stat-card .sub {
        font-size: 12px;
        color: var(--text2);
        margin-top: 8px;
      }
      .stat-card.accent .value { color: var(--accent); }
      .stat-card.green .value { color: var(--green); }

      .section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 24px;
      }
      .section h2 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .apply-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 500px;
        overflow-y: auto;
      }
      .apply-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        background: var(--surface2);
        border-radius: 12px;
        border: 1px solid transparent;
        transition: all 0.2s;
      }
      .apply-item:hover {
        border-color: var(--accent);
        background: rgba(10, 102, 194, 0.05);
      }
      .apply-item .title {
        font-weight: 600;
        font-size: 15px;
        color: var(--text);
      }
      .apply-item .meta {
        font-size: 12px;
        color: var(--text2);
        margin-top: 4px;
        display: flex;
        gap: 16px;
      }
      .btn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: filter 0.2s;
      }
      .btn:hover { filter: brightness(1.2); }
      
      #log-box {
        background: #000;
        color: #0f0;
        font-family: "Cascadia Code", "Courier New", monospace;
        font-size: 12px;
        padding: 16px;
        border-radius: 8px;
        height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>LinkieDin Enterprise</h1>
      <div style="display: flex; gap: 16px; align-items: center">
        <div class="status">
          <div class="dot" id="statusDot"></div>
          <span id="statusText">Active</span>
        </div>
        <button class="btn" onclick="triggerRun()">▶ Run All</button>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card accent">
        <div class="label">Total Applied</div>
        <div class="value" id="totalApplied">0</div>
        <div class="sub">Since installation</div>
      </div>
      <div class="stat-card green">
        <div class="label">Daily Goal</div>
        <div class="value" id="dailyGoal">10</div>
        <div class="sub">10 AM - 1 PM Window</div>
      </div>
      <div class="stat-card">
        <div class="label">Profile Status</div>
        <div class="value" id="profileStatus">Healthy</div>
        <div class="sub">Headline Updated 2h ago</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px">
      <div class="section">
        <h2>Recent Applications</h2>
        <div class="apply-list" id="applyList">
          <div style="text-align: center; color: var(--text2); padding: 40px">Loading history...</div>
        </div>
      </div>
      <div class="section">
        <h2>Live Logs</h2>
        <div id="log-box">Waiting for logs...</div>
      </div>
    </div>

    <script>
      async function refreshStats() {
        try {
          const res = await fetch('/api/stats');
          const data = await res.json();
          document.getElementById('totalApplied').innerText = data.total_applied;
          
          const list = document.getElementById('applyList');
          if (data.recent_applications.length === 0) {
            list.innerHTML = '<div style="text-align: center; color: var(--text2); padding: 40px">No applications yet.</div>';
          } else {
            list.innerHTML = data.recent_applications.map(job => `
              <div class="apply-item">
                <div>
                  <div class="title">${job.title}</div>
                  <div class="meta">
                    <span>🏢 ${job.company}</span>
                    <span>🕒 ${job.timestamp.split('T')[0]}</span>
                  </div>
                </div>
                <div style="color: var(--accent); font-weight: 700">✓ Applied</div>
              </div>
            `).join('');
          }
        } catch(e) {}
      }

      async function triggerRun() {
        if(!confirm("Are you sure you want to trigger a manual automation run?")) return;
        try {
          await fetch('/api/run', {method: 'POST'});
          alert("Run triggered in background!");
        } catch(e) {}
      }

      async function startLogs() {
        const box = document.getElementById('log-box');
        try {
            const response = await fetch('/api/logs');
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                box.innerText += decoder.decode(value);
                box.scrollTop = box.scrollHeight;
            }
        } catch (e) {
            box.innerText = "Log sync failed. Refresh to retry.";
        }
      }

      refreshStats();
      startLogs();
      setInterval(refreshStats, 30000);
    </script>
  </body>
</html>
